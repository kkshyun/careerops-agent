spring:
  config:
    # 저장소 루트 .env를 properties 형식으로 로드(신규 dependency 없이 Boot 내장
    # spring.config.import[.properties] 힌트 사용). OS 환경변수가 이 값보다
    # 항상 우선하므로(ADR-0010), test task가 강제하는 SPRING_DATASOURCE_URL은
    # 영향받지 않는다. .env가 없으면(optional) 조용히 건너뛴다.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

careerops:
  ai:
    api-key: ${CAREEROPS_ANTHROPIC_API_KEY:}
    model: claude-sonnet-5
    connect-timeout-seconds: 10
    request-timeout-seconds: 300
    match:
      connect-timeout-seconds: 10
      request-timeout-seconds: 45
    agent:
      connect-timeout-seconds: 10
      request-timeout-seconds: 60
    recommendation:
      connect-timeout-seconds: 10
      request-timeout-seconds: 90
    application-draft:
      connect-timeout-seconds: 10
      request-timeout-seconds: 150
  collector:
    alio:
      api-key: ${JOB_ALIO_API_KEY:}
      base-url: https://opendata.alio.go.kr/new/v1/recruit
  kakao:
    rest-api-key: ${CAREEROPS_KAKAO_REST_API_KEY:}
    client-secret: ${CAREEROPS_KAKAO_CLIENT_SECRET:}
    initial-refresh-token: ${CAREEROPS_KAKAO_INITIAL_REFRESH_TOKEN:}
    auth-base-url: https://kauth.kakao.com
    api-base-url: https://kapi.kakao.com
    connect-timeout-seconds: 5
    request-timeout-seconds: 10
  scheduler:
    alio:
      enabled: ${CAREEROPS_SCHEDULER_ALIO_ENABLED:true}
      initial-delay: PT1M
      fixed-delay: PT6H
      num-of-rows: 5000
  automation:
    prepare:
      enabled: ${CAREEROPS_AUTOMATION_PREPARE_ENABLED:false}
      cron: "0 50 7 * * *"
      zone: Asia/Seoul
      limit: 5
    delivery:
      enabled: ${CAREEROPS_AUTOMATION_DELIVERY_ENABLED:false}
      cron: "0 0 8 * * *"
      zone: Asia/Seoul
      limit: 5

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
