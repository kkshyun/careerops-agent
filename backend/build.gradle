plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.careerops'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'com.anthropic:anthropic-java:2.54.0'
    implementation 'org.jspecify:jspecify:1.0.0'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
    useJUnitPlatform()
    // ADR-0010: dev DB(SPRING_DATASOURCE_URL, .env)와 완전히 분리된 전용 테스트 DB.
    // application.properties 등 설정 파일로는 OS 환경변수(.env로 source된
    // SPRING_DATASOURCE_URL)를 이길 수 없어 여기서 테스트 JVM 환경변수를 직접 강제한다.
    environment 'SPRING_DATASOURCE_URL', 'jdbc:postgresql://localhost:5432/careerops_test'
    environment 'CAREEROPS_SCHEDULER_ALIO_ENABLED', 'false'
    environment 'CAREEROPS_AUTOMATION_PREPARE_ENABLED', 'false'
    environment 'CAREEROPS_AUTOMATION_DELIVERY_ENABLED', 'false'
}
